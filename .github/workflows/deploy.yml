name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        uses: withastro/action@v3
        # Detects the package manager, installs deps, runs `astro build`,
        # and uploads ./dist as the Pages artifact. Running via npm also
        # fires the `prebuild` script, which stages the SuperSplat viewer.
        env:
          # Base URL for the .sog splat files, hosted off-repo so they stay
          # out of git and out of the Pages artifact. Set as a repository
          # variable; when unset the build falls back to public/splats/.
          PUBLIC_SPLAT_BASE: ${{ vars.PUBLIC_SPLAT_BASE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
